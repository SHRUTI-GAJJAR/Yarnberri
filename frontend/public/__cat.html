<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>category cards v2</title>
    <style>
      body { font: 12px/1.35 Consolas, monospace; margin: 0; padding: 10px; }
      #out { white-space: pre; }
      iframe { border: 2px solid #c00; }
    </style>
  </head>
  <body>
    <div id="out">measuring&hellip;</div>
    <iframe id="f"></iframe>
    <script>
      const q = new URLSearchParams(location.search);
      const W = parseInt(q.get('w') || '1440', 10);
      const out = document.getElementById('out');
      const f = document.getElementById('f');
      f.style.width = W + 'px';
      f.style.height = (q.get('h') || '1000') + 'px';
      f.src = '/';

      f.addEventListener('load', () => {
        const w = f.contentWindow;
        const d = f.contentDocument;
        const rows = [];
        const wait = (ms) => new Promise((r) => setTimeout(r, ms));
        const mark = (ok, t) => (ok ? '  PASS ' : '  FAIL ') + t;

        // Recurse into @media so nested :hover rules are visible.
        function allRules(rules, mediaQuery) {
          let acc = [];
          [...rules].forEach((r) => {
            if (r.cssRules) {
              acc = acc.concat(allRules(r.cssRules, r.conditionText || mediaQuery));
            } else if (r.selectorText) {
              acc.push({ sel: r.selectorText, css: r.style, media: mediaQuery });
            }
          });
          return acc;
        }

        (async () => {
          await wait(1500);
          if (q.get('scroll')) {
            d.querySelector('.yb-category-section').scrollIntoView({ block: 'start' });
            await wait(500);
          }

          const cards = [...d.querySelectorAll('.yb-category-card')];
          const imgs = [...d.querySelectorAll('.yb-category-card__artwork')];
          const falls = [...d.querySelectorAll('.yb-category-card__fallback')];
          const t = (el) => getComputedStyle(el).transform;

          rows.push('WIDTH ' + W);
          rows.push('');
          rows.push('--- IMAGE / ARTWORK ---');
          rows.push(mark(imgs.every((i) => getComputedStyle(i).objectFit === 'contain'),
            'object-fit contain -> ' + JSON.stringify(imgs.map((i) => getComputedStyle(i).objectFit))));
          rows.push(mark(imgs.every((i) => i.naturalWidth === 1254), 'naturalWidth 1254 (not cropped)'));
          const imgBox = imgs[0].getBoundingClientRect();
          const panel = imgs[0].parentElement.getBoundingClientRect();
          rows.push(mark(imgBox.width <= panel.width + 0.5 && imgBox.height <= panel.height + 0.5,
            'artwork box ' + Math.round(imgBox.width) + 'x' + Math.round(imgBox.height) +
            ' inside panel ' + Math.round(panel.width) + 'x' + Math.round(panel.height)));
          rows.push(mark(falls.every((x) => getComputedStyle(x).display !== 'none'), 'icons visible'));

          rows.push('');
          rows.push('--- RESTING (layered stack) ---');
          const c0 = cards[0];
          rows.push('image  ' + t(c0.querySelector('.yb-category-card__image')));
          rows.push('content ' + t(c0.querySelector('.yb-category-card__content')));

          rows.push('');
          rows.push('--- :hover RULES ACTUALLY SHIPPED ---');
          const rules = allRules(d.styleSheets.length ? [...d.styleSheets].flatMap((s) => { try { return [...s.cssRules]; } catch (e) { return []; } }) : []);
          rules
            .filter((r) => /yb-category-card:hover[^{]*__(image|content|explore)/.test(r.sel) && r.css.transform)
            .forEach((r) => rows.push('  [' + (r.media || 'all') + '] ' + r.sel + ' => ' + r.css.transform));

          rows.push('');
          rows.push('--- HOVER SIMULATION (rules copied onto .sim) ---');
          // Apply the real shipped hover declarations to a clone class so the
          // visual result can be screenshotted. Values come from CSSOM.
          const pick = (suffix) => rules.filter((r) =>
            r.media === '(hover: hover) and (pointer: fine)' &&
            new RegExp('yb-category-card:hover[^{]*' + suffix).test(r.sel) && r.css.transform)[0];
          const hi = pick('__image');
          const hc = pick('__content');
          const he = pick('__explore');
          rows.push('image rule  : ' + (hi ? hi.css.transform : 'NOT FOUND'));
          rows.push('content rule: ' + (hc ? hc.css.transform : 'NOT FOUND'));
          if (hi && hc) {
            const st = d.createElement('style');
            st.textContent =
              '.sim .yb-category-card__image{transform:' + hi.css.transform + ' !important}' +
              '.sim .yb-category-card__content{transform:' + hc.css.transform + ' !important}' +
              (he ? '.sim .yb-category-card__explore svg{transform:' + he.css.transform + ' !important}' : '');
            d.head.appendChild(st);
            c0.classList.add('sim');
            await wait(600);
            rows.push('after sim -> image  ' + t(c0.querySelector('.yb-category-card__image')));
            rows.push('after sim -> content ' + t(c0.querySelector('.yb-category-card__content')));
            const ic = c0.querySelector('.yb-category-card__image').getBoundingClientRect();
            const cr = c0.getBoundingClientRect();
            rows.push(mark(ic.left >= cr.left - 0.5 && ic.right <= cr.right + 0.5,
              'hover image inside card (L' + Math.round(ic.left - cr.left) + ' R' + Math.round(cr.right - ic.right) + ')'));
            rows.push(mark(d.documentElement.scrollWidth <= w.innerWidth + 1,
              'no h-overflow while hovered scrollW=' + d.documentElement.scrollWidth));
          }

          out.textContent = rows.join('\n');
        })();
      });
    </script>
  </body>
</html>
